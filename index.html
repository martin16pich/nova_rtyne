header{position:sticky;top:0;z-index:15;background:rgba(255,255,255,.98);border-bottom:1px solid var(--line)}.top{min-height:86px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{color:inherit;text-decoration:none;display:block}.brandname{font-weight:900;font-size:26px;letter-spacing:-1px}.brandnote{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#777e89;font-weight:750;margin-top:1px}.stripes{margin-top:7px;width:104px;height:4px;background:linear-gradient(to right,#1d68c5 0 34%,#edc82d 34% 67%,#148e4e 67%)}.rightlink{font-size:13px;font-weight:700;text-decoration:none}.tabs{display:flex;gap:30px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{background:none;border:0;padding:17px 0 15px;white-space:nowrap;border-bottom:3px solid transparent;color:#646d78;font-size:14px;font-weight:700}.tab[aria-selected="true"]{color:#111;border-bottom-color:#151515}
main{padding-bottom:64px}.hero{display:flex;align-items:end;justify-content:space-between;gap:30px;padding:43px 0 23px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:1.8px;color:var(--blue);text-transform:uppercase}.hero h1{font-size:clamp(30px,5vw,53px);line-height:1.09;letter-spacing:-1.7px;margin:11px 0 11px}.hero p{color:#6a7480;font-size:15px;line-height:1.6;max-width:720px;margin:0}.count{border-left:1px solid var(--line);padding-left:22px;min-width:180px}.count small{font-size:11px;letter-spacing:1.1px;color:#79808b;font-weight:800;text-transform:uppercase}.count b{font-size:51px;display:block;line-height:1.3;letter-spacing:-1.5px}

.ideas{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;margin-top:22px}.formlike,.ideasnext{border:1px solid var(--line);padding:25px;border-radius:15px}.formlike h2,.ideasnext h2{font-size:22px;letter-spacing:-.5px;margin:0 0 10px}.formentry{margin-top:15px}.formentry label{display:block;font-size:12px;color:#525e6c;font-weight:760;margin-bottom:7px}.formentry input,.formentry textarea{width:100%;border:1px solid #dfe3e8;background:#f7f8fa;border-radius:9px;padding:12px;color:#84909e}.formentry textarea{height:118px;resize:none}.fakebutton{width:100%;border:none;background:#e7ecef;border-radius:9px;color:#566273;padding:13px;font-weight:750;margin-top:15px}.smallprint{font-size:12px;line-height:1.65;color:#687481;margin:15px 0 0}.ideasnext p{color:#68717d;line-height:1.65}.ideasnext .empty{margin-top:20px}footer{border-top:1px solid var(--line);color:#8c949e;font-size:12px;padding:26px 0}.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.modalback{position:fixed;inset:0;background:#09121dc9;display:none;z-index:40;align-items:center;justify-content:center;padding:16px}.modalback.show{display:flex}.modal{width:min(880px,100%);max-height:90vh;overflow:auto;background:white;border-radius:16px;box-shadow:0 12px 60px #0004}.modalheader{display:flex;align-items:start;justify-content:space-between;padding:22px 24px;gap:20px;border-bottom:1px solid var(--line)}.modalheader h3{font-size:20px;margin:0}.modalheader p{color:#8a929c;font-size:12px;margin:6px 0 0}.close{border:0;background:#f1f3f5;width:37px;height:37px;border-radius:9px;font-size:23px}.gallery{padding:22px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.pair:has(figure:only-child){grid-template-columns:1fr}figure{margin:0}figure img{width:100%;max-height:480px;object-fit:cover;border-radius:10px;background:#f4f5f6;display:block}figcaption{font-size:12px;color:#6a7682;font-weight:750;margin-top:9px}.gallery .empty{margin:0}.under{font-size:12px;line-height:1.55;color:#808a95;margin-top:15px}
@media(max-width:760px){.wrap{padding:0 18px}.hero{padding-top:30px}.count{display:none}.tabs{gap:24px}.rightlink{font-size:11px}.hero h1{font-size:37px}.ideas{grid-template-columns:1fr}}@media(max-width:440px){.top{min-height:72px}.brandname{font-size:22px}.brandnote{font-size:8px;letter-spacing:1px}.tabs{gap:22px}.tab{font-size:13px}.bodyheading h2{font-size:23px}.hero h1{font-size:34px}.item{gap:9px;padding:17px 0}.item-title{font-size:14px}.iconbtn{height:38px;min-width:38px}.legend{gap:8px}.pair{grid-template-columns:1fr}.formlike,.ideasnext{padding:19px}.modalheader{padding:17px}.gallery{padding:17px}}

rtynaci.cz/vizertyne2035/images/rtynsky-trail/soucasnost.jpg","after":"","vision":false},{"id":"bod-27","tab":"long","title":"Připravit dlouhodobou koncepci sportovního a kulturního centra","category":"Rozvoj města","detail":"Ověřovat využití vhodných ploch v centru a dlouhodobý provozní model.","status":"progress","photo":"https://www.rtynaci.cz/vizertyne2035/images/centrum/soucasnost.jpg","after":"","vision":false},{"id":"bod-29","tab":"four","title":"Park na horní Rtyni","category":"Veřejná zeleň","detail":"Nápad na příjemnější veřejný park v horní části města. Jde o nezávaznou vizualizaci k veřejné diskusi, nikoli o schválený projekt.","status":"progress","photo":"https://www.rtynaci.cz/vizertyne2035/images/horni/soucasnost.jpg","after":"https://www.rtynaci.cz/vizertyne2035/images/horni/vize.jpg","vision":true},{"id":"bod-30","tab":"four","title":"Hornická ulice","category":"Ulice a doprava","detail":"Představa úpravy uličního prostoru a zeleně. Jde o nezávaznou vizualizaci k veřejné diskusi, nikoli o schválený projekt.","status":"progress","photo":"https://www.rtynaci.cz/vizertyne2035/images/hornicka/soucasnost.jpg","after":"https://www.rtynaci.cz/vizertyne2035/images/hornicka/vize.jpg","vision":true},{"id":"bod-31","tab":"four","title":"Hřiště na dolní Rtyni","category":"Sport a děti","detail":"Inspirace pro veřejné hřiště a pobytovou plochu. Jde o nezávaznou vizualizaci k veřejné diskusi, nikoli o schválený projekt.","status":"progress","photo":"https://www.rtynaci.cz/vizertyne2035/images/dolni/soucasnost.jpg","after":"https://www.rtynaci.cz/vizertyne2035/images/dolni/vize.jpg","vision":true},{"id":"bod-32","tab":"long","title":"Centrum města","category":"Centrum","detail":"Vize širšího centra se sportem, pohybem a veřejným prostorem. Jde o nezávaznou vizualizaci k veřejné diskusi, nikoli o schválený projekt.","status":"progress","photo":"https://www.rtynaci.cz/vizertyne2035/images/centrum/soucasnost.jpg","after":"https://www.rtynaci.cz/vizertyne2035/images/c <script>
(()=>{'use strict';
const DATA=JSON.parse(document.getElementById('data').textContent);
const SECTIONS=[['100','Za 100 dní','Co uděláme za 100 dní','Konkrétní kroky, které chceme začít řešit hned.'],['year','Do roka','Co uděláme do roka','Příprava studií a změn, které se mohou promítnout do rozhodování města.'],['four','Do 4 let','Co uděláme do 4 let','Konkrétní úkoly a rozvojové projekty pro volební období.'],['long','Dlouhodobé cíle','Naše dlouhodobé cíle','Vize Rtyně 2035 a další témata, která přesahují jedno volební období.'],['ideas','Zapojte se','Zapojte se','Město se má rozvíjet spolu s jeho obyvateli.']];
let active='100';let lastFocus=null;
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function validPhoto(src){return typeof src==='string'&&(/^(https:\/\/|data:image\/(jpeg|png|webp);base64,)/i.test(src))?src:''}
function render(){const sec=SECTIONS.find(x=>x[0]===active);el('tabs').innerHTML=SECTIONS.map(x=>`<button type="button" role="tab" class="tab" aria-selected="${x[0]===active}" data-tab="${x[0]}">${x[1]}</button>`).join('');el('heading').textContent=sec[2];el('lead').textContent=sec[3];const tasks=DATA.filter(x=>x.tab===active);el('count').innerHTML=active==='ideas'?'':`<small>Bodů v záložce</small><b>${tasks.length}</b>`;
if(active==='ideas'){el('content').innerHTML=`<div class="ideas"><section class="formlike"><h2>Přidejte svůj návrh</h2><p class="smallprint">Toto je zatím vizuální ukázka formuláře. Skutečné odesílání zapneme až po zprovoznění zabezpečené administrace a schvalování.</p><div class="formentry"><label>Jméno a příjmení</label><input placeholder="Vaše jméno" disabled></div><div class="formentry"><label>Váš návrh</label><textarea placeholder="Co by se mělo ve Rtyni změnit?" disabled></textarea></div><div class="formentry"><label>Příloha</label><input type="file" disabled></div><button type="button" class="fakebutton" disabled>Odesílání zatím není aktivní</button><p class="smallprint">Po spuštění se příspěvky budou zveřejňovat až po schválení správcem. Anonymní příspěvky nebudou veřejně zobrazeny.</p></section><aside class="ideasnext"><h2>Nápady občanů</h2><p>Schválené návrhy se budou zobrazovat pod formulářem, včetně popisu a případných příloh.</p><div class="empty">Zatím nejsou zveřejněny žádné schválené návrhy.</div></aside></div>`;return}
el('content').innerHTML=`<div class="legend"><span>✅ hotovo</span><span>⚠️ v procesu</span><span>❌ nerealizováno</span><span>ⓘ aktuální informace</span></div><div class="items">${tasks.map(x=>`<article class="item"><div><div class="category">${esc(x.category)}</div><h3 class="item-title">${esc(x.title)}</h3></div><div class="actions"><button type="button" class="iconbtn statusbtn" data-photo="${esc(x.id)}" title="Zobrazit fotografii" aria-label="Fotografie – ${esc(x.title)}">${x.status==='done'?'✅':x.status==='progress'?'⚠️':'❌'}</button><button type="button" class="iconbtn infobtn" data-info="${esc(x.id)}" aria-expanded="false" title="Podrobnosti" aria-label="Podrobnosti – ${esc(x.title)}">i</button></div></article><div class="details" id="detail-${esc(x.id)}">${esc(x.detail||'Podrobnosti budou doplněny po ověření aktuálního stavu.')}<div class="subnote">Stav: ${x.status==='done'?'hotovo':x.status==='progress'?'v procesu':'nerealizováno / neověřeno'}${x.updated?' · Poslední změna: '+esc(x.updated):''}</div></div>`).join('')}</div>`;}
function setTab(id){if(!SECTIONS.some(x=>x[0]===id))return;active=id;render();closeMenu();window.scrollTo({top:0,behavior:'instant'});history.replaceState(null,'','#'+id)}
function openPhoto(id){const x=DATA.find(z=>z.id===id);if(!x)return;lastFocus=document.activeElement;el('phototitle').textContent=x.title;const gallery=el('gallery');gallery.replaceChildren();const photo=validPhoto(x.photo)||validPhoto(x.after);if(photo){const img=document.createElement('img');img.alt=x.title;img.loading='eager';img.decoding='async';img.src=photo;img.onerror=()=>{gallery.textContent='Fotografie není k dispozici.';gallery.classList.add('photo-missing')};gallery.classList.remove('photo-missing');gallery.append(img)}else{gallery.classList.add('photo-missing');gallery.textContent='Fotografie není k dispozici.'}el('modalback').classList.add('show');document.body.style.overflow='hidden';el('close').focus()}
function closePhoto(){el('modalback').classList.remove('show');document.body.style.overflow='';el('gallery').innerHTML='';lastFocus?.focus?.()}
function closeMenu(){el('tabs').classList.remove('is-open');el('menu-toggle').setAttribute('aria-expanded','false');el('menu-toggle').setAttribute('aria-label','Otevřít nabídku')}
el('menu-toggle').addEventListener('click',()=>{const isOpen=el('tabs').classList.toggle('is-open');el('menu-toggle').setAttribute('aria-expanded',String(isOpen));el('menu-toggle').setAttribute('aria-label',isOpen?'Zavřít nabídku':'Otevřít nabídku')});
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab)return setTab(tab.dataset.tab);const photo=e.target.closest('[data-photo]');if(photo)return openPhoto(photo.dataset.photo);const info=e.target.closest('[data-info]');if(info){const d=el('detail-'+info.dataset.info);const opened=d.classList.toggle('open');info.setAttribute('aria-expanded',String(opened));return}});
el('close').addEventListener('click',closePhoto);el('modalback').addEventListener('click',e=>{if(e.target===el('modalback'))closePhoto()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(el('modalback').classList.contains('show'))closePhoto();closeMenu()}});document.addEventListener('click',e=>{if(!e.target.closest('#tabs')&&!e.target.closest('#menu-toggle'))closeMenu()});
const initial=location.hash.replace('#','');if(SECTIONS.some(x=>x[0]===initial))active=initial;render();
})();
</script></body></html>
